<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한 방 야구</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section class="game" id="game" aria-label="터치 야구 게임">
<canvas id="field" aria-label="투수와 타자가 있는 야구 경기장"></canvas>
<div class="distance" aria-live="polite"><span>최근 비거리</span><div><strong id="lastDistance">—</strong><small>m</small></div></div>
<button id="mute" class="sound-button" type="button" aria-label="효과음 끄기" aria-pressed="false">소리 ON</button>
<div id="timing" class="timing" aria-label="타격 타이밍" hidden><div class="timing-track"><i class="sweet-spot"></i><i id="needle"></i></div></div>
<button id="swing" class="swing-button" type="button"><span id="buttonText">플레이 시작</span></button>
<p id="status" class="sr-only" role="status"></p>
</section>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
